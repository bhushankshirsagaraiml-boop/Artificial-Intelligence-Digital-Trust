{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<section class="section error-section reveal">
  <div class="error-card">
    <h1>404</h1>
    <i class="fa-solid fa-satellite-dish"></i>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Back to Home <i class="fa-solid fa-house"></i></a>
  </div>
</section>
{% endblock %}
