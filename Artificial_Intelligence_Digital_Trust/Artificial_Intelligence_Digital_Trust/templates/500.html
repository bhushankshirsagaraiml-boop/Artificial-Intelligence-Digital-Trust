{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<section class="section error-section reveal">
  <div class="error-card">
    <h1>500</h1>
    <i class="fa-solid fa-server"></i>
    <h2>Something Went Wrong</h2>
    <p>An unexpected server error occurred. Please try again shortly.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Back to Home <i class="fa-solid fa-house"></i></a>
  </div>
</section>
{% endblock %}
