{% extends "base.html" %}
{% block title %}Admin Login | AI & Digital Trust{% endblock %}

{% block content %}
<section class="section auth-section reveal">
  <div class="glass-card auth-card">
    <i class="fa-solid fa-user-shield auth-icon"></i>
    <h2>Admin Login</h2>
    <p class="auth-sub">Restricted access — authorized administrators only.</p>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="username"><i class="fa-solid fa-user"></i> Username</label>
        <input type="text" id="username" name="username" placeholder="admin" required>
      </div>
      <div class="form-group">
        <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
    </form>
    <p class="auth-hint">Default credentials: <strong>admin</strong> / <strong>admin123</strong></p>
  </div>
</section>
{% endblock %}
